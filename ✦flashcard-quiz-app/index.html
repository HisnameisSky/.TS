<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcard Quiz App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="app">
      <h1>Flashcard Quiz</h1>

      <section id="flashcard" class="flashcard"></section>

      <button id="delete-btn" type="button">Delete Card</button>

      <form id="entry-form">
        <label for="front-text">Question</label>
        <textarea id="front-text"></textarea>

        <label for="back-text">Answer</label>
        <textarea id="back-text"></textarea>

        <button type="submit">Add Flashcard</button>
      </form>
    </main>

    <script src="index.ts"></script>
  </body>
</html>
